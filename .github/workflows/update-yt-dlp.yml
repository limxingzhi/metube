name: update-yt-dlp

on:
  schedule:
    # Friday 23:00 SGT (UTC+8).
    - cron: '0 15 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update yt-dlp
        id: update
        run: |
          uv sync --locked
          # Check if yt-dlp has updates available
          LATEST_VERSION=$(uv pip list --outdated --format json | jq -r '.[] | select(.name == "yt-dlp") | .latest_version')
          CURRENT_VERSION=$(uv pip list --format json | jq -r '.[] | select(.name == "yt-dlp") | .version')
          if [ -n "$LATEST_VERSION" ] && [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Updating yt-dlp from $CURRENT_VERSION to $LATEST_VERSION"
            # A package name: extras are not part of it, and pyproject.toml
            # decides which ones are installed.
            uv lock --upgrade-package yt-dlp
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add uv.lock
            git commit -m "upgrade yt-dlp from $CURRENT_VERSION to $LATEST_VERSION"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "yt-dlp is already up to date ($CURRENT_VERSION)"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push lockfile bump
        if: steps.update.outputs.updated == 'true'
        run: git push

      # A GITHUB_TOKEN push does not start other workflows, so main.yml's
      # build + release never fires on its own. Dispatch it explicitly.
      - name: Start the release
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yml --ref master
